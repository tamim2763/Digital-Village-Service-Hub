about.principles.title=আমাদের নীতিমালা
about.principles.desc=ব্যবহারকারীর চাহিদাকে সবচেয়ে বেশি গুরুত্ব দিয়ে, সহজ ও নির্ভরযোগ্য সেবা প্রদান করা আমাদের মূল লক্ষ্য।

