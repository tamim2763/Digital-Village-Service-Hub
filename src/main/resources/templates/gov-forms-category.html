<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('gov_forms_category.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>

<main class="bg-light py-5 min-vh-100">
    <div class="container">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{nav.home}">হোম</a></li>
                <li class="breadcrumb-item"><a th:href="@{/services/forms}" th:text="#{nav.services.forms}">সরকারি ফরম</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${#locale.language == 'bn' ? category.nameBn : category.nameEn}">ক্যাটাগরি</li>
            </ol>
        </nav>

        <!-- Category Header -->
        <div class="d-flex align-items-center mb-4">
            <div class="display-5 me-3" th:text="${category.iconEmoji}">🪪</div>
            <h1 class="h2 mb-0 fw-bold" th:text="${#locale.language == 'bn' ? category.nameBn : category.nameEn}">Category Name</h1>
        </div>

        <!-- Services List -->
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="service : ${category.services}">
                <div class="card h-100 border-0 shadow-sm transition-hover">
                    <div class="card-body">
                        <h3 class="h5 card-title fw-bold text-primary mb-3" th:text="${#locale.language == 'bn' ? service.nameBn : service.nameEn}">Service Name</h3>
                        <p class="card-text text-muted mb-4" th:text="${#locale.language == 'bn' ? service.purposeBn : service.purposeEn}" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                            Purpose of the service goes here.
                        </p>
                        
                        <div class="d-flex flex-column gap-2 mb-4 fs-7 text-secondary">
                            <div><i class="fa-solid fa-money-bill me-2"></i><span th:text="${#locale.language == 'bn' ? service.feeBn : service.feeEn}">Free</span></div>
                            <div><i class="fa-solid fa-clock me-2"></i><span th:text="${#locale.language == 'bn' ? service.processingTimeBn : service.processingTimeEn}">7 Days</span></div>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 pt-0 pb-4 px-4">
                        <a th:href="@{/services/forms/{catSlug}/{svcSlug}(catSlug=${category.slug}, svcSlug=${service.slug})}" 
                           class="btn btn-outline-primary w-100 fw-bold rounded-pill" th:text="#{gov_forms.btn.view_details}">বিস্তারিত দেখুন</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<style>
.transition-hover {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border-radius: 12px;
}
.transition-hover:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
}
.fs-7 {
    font-size: 0.9rem;
}
</style>

</body>
</html>
