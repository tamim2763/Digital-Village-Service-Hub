<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('telemedicine.confirmation.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>
<main>
    <section class="page-section">
        <div class="container text-center">
            <i class="fa-solid fa-circle-check text-success" style="font-size: 4rem;"></i>
            <h1 class="mt-3" th:text="#{telemedicine.confirmation.title}">Appointment Confirmed</h1>
            <p class="section-copy mx-auto" style="max-width: 42rem;" th:text="#{telemedicine.confirmation.subtitle}">Your telemedicine booking has been created successfully.</p>

            <div class="service-card mx-auto mt-4 text-start" style="max-width: 640px;">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                    <span class="text-muted" th:text="#{telemedicine.confirmation.reference_label}">Booking Reference</span>
                    <strong th:text="${bookingReference}">DV-TM-12345678</strong>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <small class="text-muted d-block" th:text="#{telemedicine.confirmation.doctor_label}">Doctor</small>
                        <strong th:text="${#locale.language == 'bn' ? doctor.nameBn : doctor.nameEn}">Doctor Name</strong>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted d-block" th:text="#{telemedicine.confirmation.specialization_label}">Specialization</small>
                        <strong th:text="${#locale.language == 'bn' ? doctor.specializationBn : doctor.specializationEn}">Specialization</strong>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted d-block" th:text="#{telemedicine.confirmation.consultation_type_label}">Consultation Type</small>
                        <strong th:text="#{telemedicine.consultation.__${#strings.toLowerCase(appointment.consultationType.name())}__}">Video Consultation</strong>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted d-block" th:text="#{telemedicine.confirmation.date_label}">Date</small>
                        <strong th:text="${formattedDate != null ? formattedDate : #temporals.format(appointment.appointmentDate, 'dd MMM yyyy')}">01 Jan 2026</strong>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted d-block" th:text="#{telemedicine.confirmation.time_label}">Time</small>
                        <strong th:text="${formattedTime != null ? formattedTime : #temporals.format(appointment.appointmentTime, 'hh:mm a')}">10:30 AM</strong>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted d-block" th:text="#{telemedicine.label.availability}">Availability</small>
                        <strong th:text="#{telemedicine.status.__${#strings.toLowerCase(doctor.availableStatus.name())}__}">Online</strong>
                    </div>
                </div>

                <div class="mt-4 d-grid gap-2 d-sm-flex justify-content-sm-between">
                    <button type="button" class="btn btn-primary-dv" disabled th:text="#{telemedicine.confirmation.start_call}">Start Call Now</button>
                    <a class="btn btn-secondary-dv" th:href="@{/services/telemedicine}" th:text="#{telemedicine.confirmation.back_to_doctors}">Back to Doctors</a>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
