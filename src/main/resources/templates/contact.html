<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('contact.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('contact')}"></div>

<main class="page-section">
    <div class="container">
        <div class="section-heading">
            <span class="section-kicker" th:text="#{contact.kicker}">Contact</span>
            <h1 class="mt-2" th:text="#{contact.heading}">Get in touch with us</h1>
            <p class="section-copy mb-0" th:text="#{contact.description}">Reach out to us for any questions.</p>
        </div>
        <div class="row g-4">
            <div class="col-md-4">
                <article class="contact-card">
                    <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
                    <h3 th:text="#{contact.email.title}">Email</h3>
                    <p class="mb-0" th:text="#{contact.email.value}">support@digitalvillage.local</p>
                </article>
            </div>
            <div class="col-md-4">
                <article class="contact-card">
                    <div class="contact-icon"><i class="fa-solid fa-phone"></i></div>
                    <h3 th:text="#{contact.phone.title}">Phone</h3>
                    <p class="mb-0" th:text="#{contact.phone.value}">+880 1700 000 000</p>
                </article>
            </div>
            <div class="col-md-4">
                <article class="contact-card">
                    <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
                    <h3 th:text="#{contact.location.title}">Location</h3>
                    <p class="mb-0" th:text="#{contact.location.value}">Rural Service Center, Bangladesh</p>
                </article>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
