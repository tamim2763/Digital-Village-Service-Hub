<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('contact')}"></div>

<main class="page-section">
    <div class="container">
        <div class="section-heading">
            <span class="section-kicker">Contact</span>
            <h1 class="mt-3">Placeholder contact routes for the platform team.</h1>
            <p class="section-copy mb-0">No submission flow is implemented yet. This page exists only to complete the starter navigation.</p>
        </div>
        <div class="row g-4">
            <div class="col-md-4">
                <article class="contact-card">
                    <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
                    <h3>Email</h3>
                    <p class="mb-0">support@digitalvillage.local</p>
                </article>
            </div>
            <div class="col-md-4">
                <article class="contact-card">
                    <div class="contact-icon"><i class="fa-solid fa-phone"></i></div>
                    <h3>Phone</h3>
                    <p class="mb-0">+91 00000 00000</p>
                </article>
            </div>
            <div class="col-md-4">
                <article class="contact-card">
                    <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
                    <h3>Location</h3>
                    <p class="mb-0">Rural service center placeholder</p>
                </article>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
