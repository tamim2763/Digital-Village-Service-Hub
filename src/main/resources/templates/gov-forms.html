<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('gov_forms.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>

<main>
    <!-- Hero Section -->
    <section class="hero-section text-center py-5">
        <div class="container">
            <h1 class="hero-title mb-3" th:text="#{gov_forms.hero.title}">আজ আপনি কী করতে চান?</h1>
            <p class="hero-copy mb-4" th:text="#{gov_forms.hero.subtitle}">সরকারি বিভিন্ন সেবা ও ফরমের সঠিক দিকনির্দেশনা</p>
            
            <!-- Quick Service Dropdown -->
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <label for="quickServiceSelect" class="form-label fw-bold" th:text="#{gov_forms.quick_select}">দ্রুত সেবা নির্বাচন করুন</label>
                            <select id="quickServiceSelect" class="form-select form-select-lg mb-3" onchange="if(this.value) window.location.href=this.value;">
                                <option value="" selected th:text="#{gov_forms.dropdown.placeholder}">-- একটি সেবা নির্বাচন করুন --</option>
                                <optgroup th:each="cat : ${categories}" 
                                          th:label="${#locale.language == 'bn' ? cat.nameBn : cat.nameEn}">
                                    <option th:each="svc : ${cat.services}" 
                                            th:value="@{/services/forms/{catSlug}/{svcSlug}(catSlug=${cat.slug}, svcSlug=${svc.slug})}"
                                            th:text="${#locale.language == 'bn' ? svc.nameBn : svc.nameEn}">
                                    </option>
                                </optgroup>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Categories Grid -->
    <section class="page-section bg-light py-5">
        <div class="container">
            <h2 class="section-title text-center mb-5" th:text="#{gov_forms.categories.title}">সেবার ক্যাটাগরি</h2>
            <div class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="cat : ${categories}">
                    <a th:href="@{/services/forms/{slug}(slug=${cat.slug})}" class="text-decoration-none">
                        <div class="card h-100 service-category-card shadow-sm border-0 transition-hover">
                            <div class="card-body text-center p-4">
                                <div class="display-4 mb-3" th:text="${cat.iconEmoji}">🪪</div>
                                <h3 class="h5 text-dark mb-0 fw-bold" th:text="${#locale.language == 'bn' ? cat.nameBn : cat.nameEn}">Identity</h3>
                                <p class="text-muted mt-2 mb-0" th:text="${cat.services.size()} + ' ' + #{gov_forms.services_count}">5 Services</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<style>
.service-category-card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border-radius: 12px;
}
.service-category-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
}
</style>

</body>
</html>
