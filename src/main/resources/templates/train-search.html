<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('train.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>
<main class="page-section">
    <div class="container">
        <h2 th:text="#{train.search.title}">Search Train Tickets</h2>
        
        <form th:action="@{/services/train/search}" th:object="${searchForm}" method="post" class="card p-4 mt-4 shadow-sm border-0">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label" th:text="#{train.search.from}">From</label>
                    <select class="form-select" th:field="*{fromStation}">
                        <option value="Dhaka" th:text="#{train.station.dhaka}">Dhaka</option>
                        <option value="Chattogram" th:text="#{train.station.chattogram}">Chattogram</option>
                        <option value="Sylhet" th:text="#{train.station.sylhet}">Sylhet</option>
                        <option value="Tangail" th:text="#{train.station.tangail}">Tangail</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:text="#{train.search.to}">To</label>
                    <select class="form-select" th:field="*{toStation}">
                        <option value="Chattogram" th:text="#{train.station.chattogram}">Chattogram</option>
                        <option value="Dhaka" th:text="#{train.station.dhaka}">Dhaka</option>
                        <option value="Sylhet" th:text="#{train.station.sylhet}">Sylhet</option>
                        <option value="Tangail" th:text="#{train.station.tangail}">Tangail</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:text="#{train.search.date}">Date</label>
                    <input type="date" class="form-control" th:field="*{date}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label" th:text="#{train.search.class}">Class</label>
                    <select class="form-select" th:field="*{seatClass}">
                        <option value="S_CHAIR" th:text="#{train.class.s_chair}">Shovon Chair</option>
                        <option value="SNIGDHA" th:text="#{train.class.snigdha}">Snigdha</option>
                        <option value="AC_SEAT" th:text="#{train.class.ac_seat}">AC Seat</option>
                        <option value="AC_BERTH" th:text="#{train.class.ac_berth}">AC Berth</option>
                    </select>
                </div>
            </div>
            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-primary-dv" th:text="#{train.search.btn}">Search Trains</button>
            </div>
        </form>

        <div th:if="${trains != null}" class="mt-5">
            <h3 th:text="#{train.results.title}">Available Trains</h3>
            <div th:if="${#lists.isEmpty(trains)}" class="alert alert-warning mt-3" th:text="#{train.results.empty}">No trains found.</div>
            
            <div class="row g-3 mt-3">
                <div class="col-12" th:each="train : ${trains}">
                    <div class="card border-0 shadow-sm mb-4 rounded-3">
                        <div class="card-body p-4">
                            <!-- Header -->
                            <h5 class="card-title text-uppercase text-secondary fw-bold mb-4" style="font-size: 0.95rem;" th:text="${train.name}">Train Name</h5>
                            
                            <!-- Timeline -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="text-start" style="width: 25%;">
                                    <h6 class="fw-bold mb-1 text-dark" th:text="${train.departureTime}">04:30 PM</h6>
                                    <small class="text-muted fw-semibold" th:text="${searchForm.fromStation}">Dhaka</small>
                                </div>
                                <div class="text-center flex-grow-1 px-4 position-relative">
                                    <div style="border-top: 2px solid #e0e0e0; position: absolute; top: 50%; left: 0; right: 0; z-index: 1;"></div>
                                    <span class="bg-white px-2 position-relative text-muted" style="z-index: 2; font-size: 0.85rem;"><i class="fas fa-train"></i></span>
                                </div>
                                <div class="text-end" style="width: 25%;">
                                    <h6 class="fw-bold mb-1 text-dark" th:text="${train.arrivalTime}">09:25 PM</h6>
                                    <small class="text-muted fw-semibold" th:text="${searchForm.toStation}">Chattogram</small>
                                </div>
                            </div>
                            
                            <!-- Class Cards -->
                            <div class="row g-3 mt-2">
                                <div class="col-6 col-md-4 col-lg-3" th:each="cls : ${train.seatClasses}">
                                    <div class="card h-100 rounded-3 shadow-sm" th:classappend="${cls.availableSeats > 0 ? 'border-success' : 'border-danger'}" style="border-width: 2px !important; background-color: #fafafa;">
                                        <div class="card-body p-3 text-center d-flex flex-column">
                                            <h6 class="fw-bold mb-1 text-dark" th:text="${cls.className}">S_CHAIR</h6>
                                            <h5 class="text-success mb-2 fw-bold">৳<span th:text="${cls.fare}">495</span></h5>
                                            <small class="text-muted d-block mb-1 lh-sm" style="font-size: 0.75rem;" th:text="#{train.results.available}">Available Tickets (Online)</small>
                                            <h4 class="fw-bold mb-3 mt-auto" th:classappend="${cls.availableSeats > 0 ? 'text-success' : 'text-danger'}" th:text="${cls.availableSeats}">0</h4>
                                            
                                            <form th:action="@{/services/train/seats}" method="post">
                                                <input type="hidden" name="trainId" th:value="${train.id}" />
                                                <input type="hidden" name="trainName" th:value="${train.name}" />
                                                <input type="hidden" name="fromStation" th:value="${searchForm.fromStation}" />
                                                <input type="hidden" name="toStation" th:value="${searchForm.toStation}" />
                                                <input type="hidden" name="date" th:value="${searchForm.date}" />
                                                <input type="hidden" name="seatClass" th:value="${cls.className}" />
                                                <input type="hidden" name="fare" th:value="${cls.fare}" />
                                                <button type="submit" class="btn btn-sm w-100 fw-bold rounded-pill text-uppercase" 
                                                        th:classappend="${cls.availableSeats > 0 ? 'btn-success' : 'btn-secondary disabled'}" 
                                                        th:disabled="${cls.availableSeats == 0}" th:text="#{train.book.btn}">BOOK NOW</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
