<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('services.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>

<main class="page-section">
    <div class="container">
        <div class="section-heading">
            <span class="section-kicker" th:text="#{services.kicker}">Service catalog</span>
            <h1 class="mt-2" th:text="#{services.heading}">Our Services</h1>
            <p class="section-copy mb-0" th:text="#{services.description}">Each service is designed for rural communities.</p>
        </div>
        <div class="row g-4">
            <div class="col-md-6 col-xl-4" th:each="card : ${serviceCards}">
                <article class="service-card">
                    <div class="service-icon">
                        <i th:class="${card.iconClass}"></i>
                    </div>
                    <h3 th:text="#{__${card.titleKey}__}">Service title</h3>
                    <p th:text="#{__${card.descriptionKey}__}">Service description</p>
                    <span class="coming-soon-pill" th:text="#{label.coming_soon}">Coming Soon</span>
                </article>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
