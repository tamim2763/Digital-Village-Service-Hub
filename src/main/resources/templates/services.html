<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>

<main class="page-section">
    <div class="container">
        <div class="section-heading">
            <span class="section-kicker">Service roadmap</span>
            <h1 class="mt-3">The service catalog is staged for future implementation.</h1>
            <p class="section-copy mb-0">Each tile is a visual placeholder showing where feature teams can plug in their work without changing the surrounding layout.</p>
        </div>
        <div class="row g-4">
            <div class="col-md-6 col-xl-4" th:each="card : ${serviceCards}">
                <article class="service-card">
                    <div class="service-icon">
                        <i th:class="${card.iconClass}"></i>
                    </div>
                    <h3 th:text="${card.title}">Service title</h3>
                    <p th:text="${card.description}">Service description</p>
                    <span class="coming-soon-pill">Coming Soon</span>
                </article>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
