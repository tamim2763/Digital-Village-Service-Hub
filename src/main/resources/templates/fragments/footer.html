<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<footer class="footer mt-auto" th:fragment="footer">
    <div class="container py-4">
        <div class="row g-4 align-items-center">
            <div class="col-md-7">
                <strong th:text="#{footer.brand}">Digital Village Service Hub</strong>
                <p class="mb-0 mt-1" style="font-size: 0.9rem;" th:text="#{footer.description}">A multilingual digital service platform for rural communities.</p>
            </div>
            <div class="col-md-5 text-md-end">
                <small th:text="#{footer.note}">This platform is under development.</small>
            </div>
        </div>
    </div>
</footer>
</html>
