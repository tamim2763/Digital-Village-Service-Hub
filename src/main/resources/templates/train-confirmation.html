<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('train.confirmation.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>
<main class="page-section">
    <div class="container text-center">
        <i class="fa-solid fa-circle-check text-success" style="font-size: 4rem;"></i>
        <h2 class="mt-3" th:text="#{train.confirmation.title}">Booking Confirmed!</h2>
        <p class="text-muted" th:text="#{train.confirmation.subtitle}">This is a mock ticket generated for demonstration purposes.</p>
        
        <div class="card mx-auto mt-4 p-4 shadow-sm border-0 text-start" style="max-width: 500px;">
            <div class="d-flex justify-content-between border-bottom pb-3 mb-3">
                <span class="text-muted" th:text="#{train.confirmation.ref}">Booking Reference</span>
                <strong th:text="${bookingReference}">DV-12345</strong>
            </div>
            <div class="mb-3">
                <small class="text-muted d-block" th:text="#{train.passenger.name}">Passenger Name</small>
                <strong th:text="${passenger.passengerName}">Name</strong>
            </div>
            <div class="mb-3">
                <small class="text-muted d-block" th:text="#{train.summary.journey}">Journey</small>
                <strong>
                    <span th:text="#{train.station.__${#strings.toLowerCase(passenger.fromStation)}__}">From</span> 
                    &rarr; 
                    <span th:text="#{train.station.__${#strings.toLowerCase(passenger.toStation)}__}">To</span>
                </strong>
            </div>
            <div class="mb-3">
                <small class="text-muted d-block" th:text="#{train.search.date}">Date</small>
                <strong th:text="${passenger.date}">Date</strong>
            </div>
            <div class="mb-3">
                <small class="text-muted d-block" th:text="#{train.summary.train}">Train</small>
                <strong th:text="${passenger.trainName}">Train Name</strong>
                (<span th:text="#{train.class.__${#strings.toLowerCase(passenger.seatClass)}__}">Class</span>)
            </div>
            <div class="mb-3">
                <small class="text-muted d-block" th:text="#{train.seats.seat}">Seats</small>
                <strong th:text="${passenger.selectedSeats}">KHA-1, KHA-2</strong>
            </div>
            <div class="d-flex justify-content-between border-top pt-3 mt-3">
                <span class="fw-bold" th:text="#{train.summary.total}">Total Paid</span>
                <strong class="text-primary">৳<span th:text="${passenger.fare}">300</span></strong>
            </div>
        </div>
        
        <div class="mt-4">
            <a th:href="@{/services/train}" class="btn btn-primary-dv" th:text="#{train.confirmation.new}">Book Another Ticket</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
