<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('fosol.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>
<main>
    <section class="page-section py-4">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h4 mb-0" th:text="#{fosol.title}">ফসলের বাজার</h1>
                <form class="d-flex" method="get" th:action="@{/services/fosol}">
                    <input name="q" class="form-control form-control-lg me-2" th:placeholder="#{fosol.search_placeholder}" th:value="${query}" aria-label="Search">
                    <button class="btn btn-primary btn-lg" type="submit" th:text="#{fosol.search}">Search</button>
                </form>
            </div>

            <div class="row g-3">
                <div class="col-md-6 col-lg-4" th:each="it : ${items}">
                    <a th:href="@{/services/fosol/{id}(id=${it.id})}" class="text-decoration-none">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-body">
                                <h3 class="h6 fw-bold" th:text="${#locale.language == 'bn' ? it.nameBn : it.nameEn}">Item</h3>
                                <p class="text-muted small mb-2" th:text="${#locale.language == 'bn' ? it.descriptionBn : it.descriptionEn}">Short description</p>
                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <div class="fw-bold text-primary" th:if="${it.price != null}" th:text="${it.price} + ' ৳'">320 ৳</div>
                                    <div class="fw-bold text-primary" th:if="${it.price == null and !it.priceOptions.empty}" th:text="${it.priceOptions.get(0).price} + ' ৳'">30 ৳</div>
                                    <div class="text-muted small" th:text="#{fosol.available} + ': ' + ${it.quantityAvailable}">Available: 50</div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
