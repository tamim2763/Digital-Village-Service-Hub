<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('train.passenger.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>
<main class="page-section">
    <div class="container">
        <h2 th:text="#{train.passenger.title}">Passenger Details</h2>
        
        <div class="row mt-4">
            <div class="col-lg-8">
                <form th:action="@{/services/train/confirm}" th:object="${passengerForm}" method="post" class="card p-4 shadow-sm border-0">
                    <!-- Hidden fields to carry over data -->
                    <input type="hidden" th:field="*{trainId}" />
                    <input type="hidden" th:field="*{trainName}" />
                    <input type="hidden" th:field="*{fromStation}" />
                    <input type="hidden" th:field="*{toStation}" />
                    <input type="hidden" th:field="*{date}" />
                    <input type="hidden" th:field="*{seatClass}" />
                    <input type="hidden" th:field="*{fare}" />
                    <input type="hidden" th:field="*{selectedSeats}" />

                    <div class="mb-3">
                        <label class="form-label" th:text="#{train.passenger.name}">Full Name</label>
                        <input type="text" class="form-control" th:field="*{passengerName}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('passengerName')}" th:errors="*{passengerName}">Error</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" th:text="#{train.passenger.phone}">Phone Number or NID</label>
                        <input type="text" class="form-control" th:field="*{phoneNumber}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">Error</div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/services/train}" class="btn btn-secondary-dv" th:text="#{train.passenger.back}">Back</a>
                        <button type="submit" class="btn btn-primary-dv" th:text="#{train.passenger.confirm}">Confirm & Print Ticket</button>
                    </div>
                </form>
            </div>
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="card p-4 border-0 bg-light">
                    <h4 th:text="#{train.summary.title}">Journey Summary</h4>
                    <hr>
                    <p class="mb-1 fw-bold" th:text="${passengerForm.trainName}">Train Name</p>
                    <p class="mb-1 text-muted" th:text="${passengerForm.date}">Date</p>
                    <p class="mb-3">
                        <span th:text="#{train.station.__${#strings.toLowerCase(passengerForm.fromStation)}__}">From</span> 
                        &rarr; 
                        <span th:text="#{train.station.__${#strings.toLowerCase(passengerForm.toStation)}__}">To</span>
                    </p>
                    <div class="d-flex justify-content-between mb-2">
                        <span th:text="#{train.seats.seat}">Seats</span>
                        <span class="fw-bold" th:text="${passengerForm.selectedSeats}">KHA-1, KHA-2</span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold">
                        <span th:text="#{train.summary.total}">Total Fare</span>
                        <span>৳<span th:text="${passengerForm.fare}">300</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
