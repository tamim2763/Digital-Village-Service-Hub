<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head('fosol.title')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('services')}"></div>
<main>
    <section class="page-section py-4">
        <div class="container">
            <a th:href="@{/services/fosol}" class="text-muted small mb-3 d-inline-block">← <span th:text="#{fosol.back}">Back</span></a>
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h1 class="h3" th:text="${#locale.language == 'bn' ? item.nameBn : item.nameEn}">Item Name</h1>
                    <p class="text-muted" th:text="${#locale.language == 'bn' ? item.descriptionBn : item.descriptionEn}">Description</p>
                    <div class="row mt-4">
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded text-center">
                                <div class="h5 fw-bold text-primary" th:if="${item.price != null}" th:text="${item.price} + ' ৳'">320 ৳</div>
                                <div class="small text-muted mt-1" th:text="#{fosol.available} + ': ' + ${item.quantityAvailable}">Available: 50</div>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <h5 class="mb-2" th:text="#{fosol.price_options}">Price options</h5>
                            <ul class="list-group mb-3">
                                <li class="list-group-item" th:each="opt : ${item.priceOptions}">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div th:text="${#locale.language == 'bn' ? opt.labelBn : opt.labelEn}">1 kg</div>
                                        <div class="fw-bold text-primary" th:text="${opt.price} + ' ৳'">30 ৳</div>
                                    </div>
                                </li>
                                <li class="list-group-item" th:if="${item.priceOptions.empty}">
                                    <span th:text="#{fosol.no_price_options}">Standard price applies</span>
                                </li>
                            </ul>

                            <label class="form-label fw-bold" th:text="#{fosol.purchase_quantity}">Purchase quantity</label>
                            <input type="number" class="form-control form-control-lg mb-3" min="1" th:attr="max=${item.quantityAvailable}" value="1">
                            <button class="btn btn-success btn-lg" type="button" th:text="#{fosol.add_to_cart}">Add to cart</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
