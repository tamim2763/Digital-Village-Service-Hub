spring:
  datasource:
    url: ${MYSQL_JDBC_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:digital_village_service_hub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:digitalvillage}
    password: ${MYSQL_PASSWORD:digitalvillage}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  thymeleaf:
    cache: true
logging:
  level:
    root: INFO
    com.digitalvillage: WARN
